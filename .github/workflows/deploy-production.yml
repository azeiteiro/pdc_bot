name: Deploy Production to Digital Ocean

permissions:
  contents: read

on:
  push:
    branches:
      - master  # Deploy production on every push to master
  workflow_dispatch:  # Allow manual deployment trigger

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Production
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_PRODUCTION_HOST }}
          username: ${{ secrets.DO_PRODUCTION_USER }}
          key: ${{ secrets.DO_PRODUCTION_SSH_KEY }}
          port: ${{ secrets.DO_PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.DO_PRODUCTION_APP_PATH }}

            # Ensure we're using Node 24
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Install dependencies
            pnpm install --frozen-lockfile

            # Build the bot with increased memory
            NODE_OPTIONS="--max-old-space-size=2048" pnpm build

            # Restart bot with PM2 (delete + start to pick up ecosystem.config.cjs changes)
            pm2 delete telegram_festival_bot 2>/dev/null || true
            pm2 start ecosystem.config.cjs

            # Save PM2 process list
            pm2 save

            # Show status
            pm2 list
