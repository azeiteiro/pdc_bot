name: Deploy Production to Digital Ocean

permissions:
  contents: read

on:
  push:
    branches:
      - master  # Deploy production on every push to master
  workflow_dispatch:  # Allow manual deployment trigger

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Production
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_PRODUCTION_HOST }}
          username: ${{ secrets.DO_PRODUCTION_USER }}
          key: ${{ secrets.DO_PRODUCTION_SSH_KEY }}
          port: ${{ secrets.DO_PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.DO_PRODUCTION_APP_PATH }}

            # Ensure we're using Node 24
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Create .env file from GitHub Secrets
            cat > .env << 'EOF'
            NODE_ENV=production
            BOT_PRODUCTION_TOKEN=${{ secrets.BOT_PRODUCTION_TOKEN }}
            GROUP_CHAT_ID=${{ secrets.GROUP_CHAT_ID }}
            ADMIN_IDS=${{ secrets.ADMIN_IDS }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URL=${{ secrets.GOOGLE_REDIRECT_URL }}
            GOOGLE_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID }}
            GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
            ONBOARDING_SHEET_ID=${{ secrets.ONBOARDING_SHEET_ID }}
            UPLOAD_TO_GPHOTOS=true
            ALBUM_ID=${{ secrets.ALBUM_ID }}
            ALBUM_URL=${{ secrets.ALBUM_URL }}
            PHOTO_DESCRIPTION=#festival
            ACCUWEATHER_API_KEY=${{ secrets.ACCUWEATHER_API_KEY }}
            BASE_PATH=../..
            EOF

            # Install dependencies
            pnpm install --frozen-lockfile

            # Build the bot with increased memory
            NODE_OPTIONS="--max-old-space-size=2048" pnpm build

            # Restart bot with PM2
            pm2 restart telegram_festival_bot || pm2 start ecosystem.config.cjs

            # Save PM2 process list
            pm2 save

            # Show status
            pm2 list
