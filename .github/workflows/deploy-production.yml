name: Deploy Production to Digital Ocean

permissions:
  contents: read

on:
  push:
    branches:
      - master  # Deploy production on every push to master
  workflow_dispatch:  # Allow manual deployment trigger

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint check
        run: yarn lint

      - name: Format check
        run: yarn format

      - name: TypeScript type check
        run: yarn tsc --noEmit

      - name: Build
        run: yarn build

  deploy:
    name: Deploy to Production
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_PRODUCTION_HOST }}
          username: ${{ secrets.DO_PRODUCTION_USER }}
          key: ${{ secrets.DO_PRODUCTION_SSH_KEY }}
          port: ${{ secrets.DO_PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.DO_PRODUCTION_APP_PATH }}

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Install dependencies
            yarn install --frozen-lockfile

            # Build the bot
            yarn build

            # Restart bot with PM2
            pm2 restart telegram_festival_bot || pm2 start ecosystem.config.js

            # Save PM2 process list
            pm2 save

            # Show status
            pm2 list
